# ── Production stack: Astro app + PostgreSQL 16 ──────────────────────────────
#
# Coolify handles port routing via Traefik — do NOT bind host ports on the app.
# The app listens on 4321 internally (set in the Dockerfile).
#
# First deploy: after the containers are up, seed the DB:
#   docker compose run --rm app npm run db:seed

services:
  app:
    build: .
    env_file:
      - .env
    environment:
      # Must match EXPOSE 4321 in the Dockerfile.
      # Coolify may inject PORT=8080 via .env — this overrides it.
      PORT: "4321"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-becode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-becode}
      POSTGRES_DB: ${POSTGRES_DB:-becode}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-becode} -d ${POSTGRES_DB:-becode}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  uploads:
  pgdata:
