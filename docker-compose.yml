# ── Production stack: Astro app + PostgreSQL 16 ──────────────────────────────
#
# Usage:
#   1. Copy .env.example to .env and fill in the secrets.
#   2. docker compose up -d --build
#   3. (Optional) Seed the database: docker compose run --rm app npm run db:seed
#
# The app image includes the Prisma CLI so migrations run automatically on
# startup via docker-entrypoint.sh.

services:
  app:
    build: .
    container_name: becode-app
    ports:
      - "${PORT:-4321}:4321"
    env_file:
      - .env
    environment:
      - PORT=4321
      - HOST=0.0.0.0
      - NODE_ENV=production
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: becode-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-becode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-becode}
      POSTGRES_DB: ${POSTGRES_DB:-becode}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432" # match the dev port from .env.example
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-becode} -d ${POSTGRES_DB:-becode}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  uploads:
  pgdata:
